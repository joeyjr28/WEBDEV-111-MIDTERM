<!DOCTYPE html>
<html>
<head>
    <title>Moto Services - Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">

    <!-- Logo -->
    <div class="auth-logo">
        <span>🏍️</span>
        <h1>MotoServices</h1>
    </div>

    <h2 class="auth-title">Create Account</h2>
    <p class="auth-subtitle">Join MotoServices today</p>

    <!-- Register Card -->
    <div class="auth-card">
        <div class="auth-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Create a password">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm your password">
            </div>
            <button class="auth-btn">Create Account</button>
            <p class="auth-switch">Already have an account? <a href="login.html">Sign in here</a></p>
        </div>
    </div>

</div>

</body>
</html>
