<!DOCTYPE html>
<html>
<head>
    <title>Moto Services - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">

    <!-- Logo -->
    <div class="auth-logo">
        <span>🏍️</span>
        <h1>MotoServices</h1>
    </div>

    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Sign in to access your account</p>

    <!-- Login Card -->
    <div class="auth-card">
        <div class="auth-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>
            <button class="auth-btn">Sign In</button>
            <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
        </div>

        <hr class="auth-divider">

        <!-- Demo Accounts -->
        <div class="demo-accounts">
            <h3>Demo Accounts</h3>
            <div class="demo-item">
                <strong>User Account</strong>
                <p>Username: user | Password: user123</p>
            </div>
            <div class="demo-item">
                <strong>Admin Account</strong>
                <p>Username: admin | Password: admin123</p>
            </div>
            <div class="demo-item">
                <strong>Super Admin Account</strong>
                <p>Username: superadmin | Password: super123</p>
            </div>
        </div>
    </div>

</div>

</body>
</html>
