<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookBuddies</title>

<style>
/* RESET & BASE */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    font-family: 'Segoe UI', sans-serif;
    background: #f5f5f5;
    color: #333;
}

/* HEADER */
header {
    background: #2b2d42;
    color: #edf2f4;
    text-align: center;
    padding: 25px 0;
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}

/* NAVIGATION */
nav {
    display: flex;
    justify-content: center;
    padding: 15px 0;
    gap: 15px;
}
nav button {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: #ef233c;
    color: #fff;
    font-weight: bold;
    transition: all 0.2s;
}
nav button:hover {
    background: #d90429;
    transform: scale(1.05);
}

/* MAIN LAYOUT */
.main-container {
    display: flex;
    gap: 20px;
    padding: 20px;
    flex-wrap: wrap;
}

/* BOOKS GRID */
.books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    flex: 3;
}

/* BOOK CARD */
.book-card {
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    text-align: center;
    transition: transform 0.2s;
}
.book-card:hover {
    transform: translateY(-5px);
}
.book-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}
.book-card h4 {
    margin: 10px 0;
}
.book-card button {
    margin-bottom: 10px;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #2b2d42;
    color: #edf2f4;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
}
.book-card button:hover {
    background: #8d99ae;
}

/* LOANS SIDEBAR */
.loans-panel {
    flex: 1;
    min-width: 250px;
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    height: fit-content;
}
.loans-panel h3 {
    text-align: center;
    margin-bottom: 15px;
}
.loans-panel ul {
    list-style: none;
}
.loans-panel li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}
.loans-panel li button {
    padding: 5px 10px;
    border: none;
    border-radius: 6px;
    background: #ef233c;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s;
}
.loans-panel li button:hover {
    background: #d90429;
}

/* RESPONSIVE */
@media(max-width: 800px) {
    .main-container {
        flex-direction: column;
    }
    .loans-panel {
        max-width: 100%;
    }
}
</style>
</head>

<body>

<header>📚 BookBuddies</header>

<nav>
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('loans')">Loans</button>
</nav>

<div class="main-container">
    <!-- BOOKS GRID -->
    <div id="home" class="books-grid"></div>

    <!-- BORROWED BOOKS SIDEBAR -->
    <div id="loans" class="loans-panel" style="display:none;">
        <h3>Borrowed Books</h3>
        <ul id="loanList"></ul>
    </div>
</div>

<script>
// BOOK DATA (online images)
let books = [
    {title:"The Alchemist", img:"https://i.pinimg.com/736x/4e/89/1a/4e891a008a3c7d70957375d3544a4e30--the-alchemist-book-covers.jpg", borrowed:false},
    {title:"War and Peace", img:"https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1672357366i/75407455.jpg", borrowed:false},
    {title:"The Catcher in the Rye", img:"https://www.hachettebookgroup.com/wp-content/uploads/2017/06/9780316769488.jpg", borrowed:false},
    {title:"Crime and Punishment", img:"https://d28hgpri8am2if.cloudfront.net/book_images/onix/cvr9781684122905/crime-and-punishment-9781684122905_hr.jpg", borrowed:false},
    {title:"The Little Prince", img:"https://cdn2.penguin.com.au/covers/original/9780141185620.jpg", borrowed:false}
];

// SHOW SECTION
function showSection(id){
    if(id==='home'){
        document.getElementById('home').style.display='grid';
        document.getElementById('loans').style.display='none';
    } else {
        document.getElementById('home').style.display='none';
        document.getElementById('loans').style.display='block';
    }
}

// DISPLAY BOOKS
function displayBooks(){
    const container = document.getElementById('home');
    container.innerHTML = '';
    books.forEach((book,index)=>{
        if(!book.borrowed){
            container.innerHTML+=`
            <div class="book-card">
                <img src="${book.img}">
                <h4>${book.title}</h4>
                <button onclick="borrowBook(${index})">Borrow</button>
            </div>
            `;
        }
    });
}

// BORROW & RETURN
function borrowBook(index){
    books[index].borrowed = true;
    displayBooks();
    updateLoans();
}
function returnBook(index){
    books[index].borrowed = false;
    displayBooks();
    updateLoans();
}

// UPDATE LOANS PANEL
function updateLoans(){
    const list = document.getElementById('loanList');
    list.innerHTML = '';
    books.forEach((book,index)=>{
        if(book.borrowed){
            list.innerHTML+=`
            <li>${book.title} <button onclick="returnBook(${index})">Return</button></li>
            `;
        }
    });
}

// INITIAL LOAD
displayBooks();
updateLoans();
</script>

</body>
</html>
