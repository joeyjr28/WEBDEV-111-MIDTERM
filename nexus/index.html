<!DOCTYPE html>
<html>
<head>
    <title>Code Nexus Event</title>

    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 60px;
        }

        input {
            padding: 10px;
            margin: 8px;
            width: 220px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 10px;
            margin: 8px;
            width: 220px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #38bdf8;
            color: black;
            font-weight: bold;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            width: 320px;
            margin: 20px auto;
            border-radius: 10px;
        }

        #dashboard, #content {
            display: none;
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div class="container" id="login">
    <h2>Code Nexus Event Login</h2>
    <input type="text" id="username" placeholder="Enter Username"><br>
    <input type="password" id="password" placeholder="Enter Password"><br>
    <button onclick="login()">Enter Event</button>
</div>

<!-- DASHBOARD -->
<div class="container" id="dashboard">
    <h2>Welcome to Code Nexus 🚀</h2>

    <button onclick="openSection('event')">Event Info</button>
    <button onclick="openSection('speakers')">Speakers</button>
    <button onclick="openSection('schedule')">Schedule</button>
    <button onclick="openSection('register')">Register</button>
    <button onclick="openSection('contact')">Contact</button>
    <button onclick="logout()">Logout</button>
</div>

<!-- CONTENT -->
<div id="content"></div>

<script>
// LOGIN (kahit ano basta may input)
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user !== "" && pass !== "") {
        document.getElementById("login").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
    } else {
        alert("Please enter username and password");
    }
}

// LOGOUT
function logout() {
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("content").style.display = "none";
    document.getElementById("login").style.display = "block";
}

// OPEN SECTIONS
function openSection(section) {
    let content = document.getElementById("content");
    content.style.display = "block";

    if(section === "event") {
        content.innerHTML = `
        <div class="card">
            <h3>Code Nexus Event</h3>
            <p>Date: April 15, 2026</p>
            <p>Location: Manila Tech Hub</p>
            <p>A gathering of developers, designers, and tech enthusiasts.</p>
        </div>`;
    }

    else if(section === "speakers") {
        content.innerHTML = `
        <div class="card">
            <h3>Speakers</h3>
            <p>Juan Dev - Web Development</p>
            <p>Maria Code - AI & Machine Learning</p>
        </div>`;
    }

    else if(section === "schedule") {
        content.innerHTML = `
        <div class="card">
            <h3>Schedule</h3>
            <p>9:00 AM - Opening</p>
            <p>10:00 AM - Keynote</p>
            <p>1:00 PM - Workshops</p>
        </div>`;
    }

    else if(section === "register") {
        content.innerHTML = `
        <div class="card">
            <h3>Register</h3>
            <input placeholder="Your Name"><br>
            <input placeholder="Email"><br>
            <button onclick="alert('Registered Successfully!')">Submit</button>
        </div>`;
    }

    else if(section === "contact") {
        content.innerHTML = `
        <div class="card">
            <h3>Contact</h3>
            <p>Email: codenexus@email.com</p>
            <p>Phone: 09123456789</p>
        </div>`;
    }
}
</script>

</body>
</html>
